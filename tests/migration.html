<!doctype html><html lang="en"><meta charset="utf-8"><title>Crab migration chart check</title><style>body{background:#10272e;color:#d6e3d9;font:16px monospace}canvas{display:block;border:1px solid #52685e}select,input{margin:12px}</style><h1>Crab migration · isolated chart check</h1><label>Knowledge rank <select id="rank"><option>3</option><option selected>4</option><option>5</option></select></label><label>Game hour <input id="hour" type="number" value="18" step="18"></label><p id="status"></p><canvas width="1000" height="600"></canvas><script type="module">
import {groundsAt,groundMotion} from '../fishing-grounds.mjs?v=0.18.43';import {drawGroundMotion} from '../chart.mjs?v=0.18.43';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),rank=document.querySelector('#rank'),hour=document.querySelector('#hour');function draw(){ctx.fillStyle='#11272e';ctx.fillRect(0,0,1000,600);let arrows=0;for(const [i,g] of groundsAt(+hour.value).filter((g,i)=>i<7||g.name==='Reymonds spot').entries()){const p={x:130+i%4*245,y:150+Math.floor(i/4)*270};ctx.strokeStyle='#6d9c8d';ctx.beginPath();ctx.ellipse(p.x,p.y,100,65,-.4,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#80a99b';ctx.textAlign='center';ctx.fillText(g.name,p.x,p.y+12);const d=groundMotion(g,+rank.value,+hour.value);drawGroundMotion(ctx,p,d);if(d)arrows++;}document.querySelector('#status').textContent=`Rank ${rank.value}: ${arrows} migration arrows · hour ${hour.value}`;}rank.onchange=hour.oninput=draw;draw();</script></html>
