<!doctype html><html lang="en"><meta charset="utf-8"><title>Pot soak verification</title><style>body{background:#0d1b22;color:#e3eee9;font:20px system-ui;padding:40px}button{padding:12px}td,th{padding:8px 24px 8px 0;text-align:left}pre{white-space:pre-wrap}</style><h1>Pot soak verification</h1><button id="run">Verify long soak and retrieve pot</button><table><thead><tr><th>Soak time</th><th>Catch in test pot</th><th>Fill rate</th></tr></thead><tbody id="rows"></tbody></table><pre id="result">Ready</pre><script type="module">
import {createGame,catchAt,handlePot,step} from '../simulation.mjs?v=0.18.32';import {potSoakStage} from '../pot-soak.mjs?v=0.18.32';
document.querySelector('#run').onclick=()=>{const p={id:1,x:1000,y:520,setAt:0,legacyAbundance:1},rows=document.querySelector('#rows');rows.replaceChildren();for(const h of [0,6,24,36,48,96,240]){const tr=document.createElement('tr');for(const value of [h+' h',catchAt(p,h)+' kg',potSoakStage(h)]){const td=document.createElement('td');td.textContent=value;tr.append(td);}rows.append(tr);}const s=createGame();Object.assign(s,{x:1000,y:500,heading:0,hour:96,paused:false});s.career.nextIncident=1e9;s.pots=[p];handlePot(s);for(let i=0;i<60;i++)step(s,1);document.querySelector('#result').textContent=s.cargo===catchAt(p,36)&&s.pots.length===0?`PASS: 96-hour pot retrieved. ${s.cargo} kg sorted into the hold.\nCatch stayed unchanged from 36 hours onward.`:'FAIL: retrieval did not preserve catch';};
</script></html>
