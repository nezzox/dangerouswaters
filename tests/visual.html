<!doctype html><html lang="en"><meta charset="utf-8"><title>Dangerous Waters · Visual checks</title><style>body{margin:0;background:#071820;color:#e2dac5;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}aside{position:fixed;top:18px;left:18px;background:#10262ee8;padding:16px;border:1px solid #526361;max-width:360px}button,select{background:#233a41;color:inherit;border:1px solid #73827c;padding:8px;margin:4px}p{margin:8px 0}small{color:#a8b9b8}</style><canvas id="scene"></canvas><aside><b>Dangerous Waters · Visual checks</b><p><small>Isolated renderer fixture. Does not read or write season saves.</small></p><p><label>Vessel <select id="boat"></select></label></p><p><label>Lighting grade <select id="light-grade"><option value="0">Standard</option><option value="1">I</option><option value="2">II</option><option value="3">III</option><option value="4">IV</option><option value="5">V</option></select></label><button id="night">Night lighting</button><button id="remote">Remote precision</button><button id="light-toggle">Lights ON</button></p><button id="cruise">Cruise / cabin breaks</button><button id="sick">Heavy seas / seasickness</button><button id="foam">Wake / 3D foam</button><button id="harbor">Dock / workers</button><button id="secured">Dock / stay secured</button><button id="haul">Haul while moving</button><button id="calm">Calm water</button><button id="work">Deploy pot / clearance</button><p><button id="pause">Resume</button><button id="rate">Time ×1</button></p><p id="status">Ready</p><p id="clock"></p><p id="moor-check"></p><details><summary>Deck diagnostics</summary><pre id="diagnostics"></pre></details></aside><script type="module">
import {createScene} from '../scene.mjs?v=0.18.42';import {createGame,conditions,handlePot,dock,BERTH} from '../simulation.mjs?v=0.18.42';import {createWake} from '../wake.mjs?v=0.18.42';import {advanceVoyage} from '../voyage.mjs?v=0.18.42';
import {BOATS,STARTER} from '../catalog.mjs?v=0.18.42';
let selectedLighting=0;document.querySelector('#light-grade').onchange=e=>{selectedLighting=Number(e.target.value);state.career.parts.lights=selectedLighting;state.paused=true;};document.querySelector('#light-toggle').onclick=()=>{state.lights=!state.lights;document.querySelector('#light-toggle').textContent=state.lights?'Lights ON':'Lights OFF';};
let selectedBoat=STARTER;for(const boat of [STARTER,...BOATS])document.querySelector('#boat').add(new Option(boat.name,boat.id));document.querySelector('#boat').onchange=e=>{selectedBoat=[STARTER,...BOATS].find(b=>b.id===e.target.value);scenario('calm');};
const scene=createScene(document.querySelector('canvas'));scene.setZoom(.52);let state=createGame(),wake=createWake(),time=0,rate=1,last=performance.now(),stopOn='',currentScenario='',securedTime=0,securedPose=null;
function scenario(kind){currentScenario=kind;securedTime=0;securedPose=null;document.querySelector('#moor-check').textContent='';state=createGame();state.career.boat=selectedBoat.id;state.career.parts.lights=selectedLighting;state.deck=selectedBoat.pots;state.capacity=selectedBoat.capacity;state.fuel=selectedBoat.tank;Object.assign(state,{x:-32000,y:-44000,heading:0,hour:11,paused:false,desiredKnots:6,speed:3,weatherOverride:'calm'});wake=createWake();time=0;rate=kind==='foam'?1:15;stopOn=kind==='cruise'?'resting in the cabin':kind==='sick'?'seasick':kind==='harbor'?'Harbor crane unloading':'';if(kind==='sick'){state.weatherOverride='rough';state.desiredKnots=3.5;state.speed=1.8;}if(kind==='foam'){state.weatherOverride='rough';state.desiredKnots=10;state.speed=5;}if(kind==='harbor'){Object.assign(state,{x:160,y:80,heading:-Math.PI/2,speed:0,desiredKnots:0,cargo:240});dock(state);}if(kind==='secured'){Object.assign(state,{x:BERTH.x,y:BERTH.y,heading:BERTH.heading,speed:0,desiredKnots:0,cargo:120});dock(state);stopOn='';}if(kind==='calm'){rate=1;}if(kind==='night'||kind==='remote'){state.hour=0;state.weatherOverride='fog';state.desiredKnots=0;state.speed=0;state.career.nextIncident=1e9;rate=1;if(kind==='remote'){state.x=-1200000;state.y=-500000;state.weatherOverride='rough';state.desiredKnots=8;state.speed=4;}}if(kind==='haul'){Object.assign(state,{speed:4.5/1.94384,desiredKnots:4.5,deck:7,pots:[{id:1,x:-32000,y:-43975,setAt:state.hour-3}]});handlePot(state);}if(kind==='work'){state.desiredKnots=0;state.speed=0;handlePot(state);rate=1;}document.querySelector('#rate').textContent=`Time ×${rate}`;}
for(const kind of ['cruise','sick','foam','work','harbor','haul','calm','secured','night','remote'])document.querySelector('#'+kind).onclick=()=>scenario(kind);
document.querySelector('#pause').onclick=()=>state.paused=!state.paused;document.querySelector('#rate').onclick=()=>{rate=rate===1?15:1;document.querySelector('#rate').textContent=`Time ×${rate}`;};
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(currentScenario==='secured'&&state.moored)state.rudder=1;time+=advanceVoyage(state,wake,dt,rate);scene.draw(state,conditions(state),time,innerWidth,innerHeight,devicePixelRatio,wake);document.querySelector('#diagnostics').textContent=JSON.stringify(scene.crewDiagnostics,null,1);if(currentScenario==='secured'&&state.moored&&!state.paused){securedPose??={x:state.x,y:state.y,heading:state.heading};securedTime+=dt*rate;const drift=Math.hypot(state.x-securedPose.x,state.y-securedPose.y)+Math.abs(state.heading-securedPose.heading);document.querySelector('#moor-check').textContent=`${drift<.001?'PASS':'FAIL'} · secured for ${securedTime.toFixed(1)} s · drift ${drift.toFixed(4)} · x ${state.x.toFixed(2)}, y ${state.y.toFixed(2)}`;if(securedTime>=15)state.paused=true;}const status=scene.crewStatus;document.querySelector('#status').textContent=status;document.querySelector('#clock').textContent=`${time.toFixed(1)} simulation seconds · ${(state.speed*1.94384).toFixed(1)} kn`;if(state.deckJob?.kind==='haul'&&state.deckJob.elapsed>20)state.paused=true;if(stopOn&&status.includes(stopOn)){state.paused=true;stopOn='';}document.querySelector('#pause').textContent=state.paused?'Resume':'Pause';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
