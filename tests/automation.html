<!doctype html><html lang="en"><meta charset="utf-8"><title>Pot automation regression</title><style>body{background:#0d1b22;color:#e3eee9;font:20px system-ui;padding:40px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Pot automation regression</h1><button id="run">Run auto set and auto haul</button><pre id="result">Ready</pre><script type="module">
import {createGame,step,pickupAllPots} from '../simulation.mjs?v=0.18.85';
import {groundsAt,crabHotspot} from '../fishing-grounds.mjs?v=0.18.85';
const sea=()=>{const s=createGame();Object.assign(s,{x:1000,y:500,heading:0,paused:false,weatherOverride:'calm'});s.career.nextIncident=1e6;return s;};
document.querySelector('#run').onclick=()=>{try{const intelligent=sea();Object.assign(intelligent,{speed:6,desiredKnots:12,autopilot:{x:10000,y:500}});Object.assign(intelligent.career,{autoDeploy:false,intelligentAutoSet:true,skills:{autoDeploy:1,intelligentAutoSet:1},parts:{sonar:5}});for(let i=0;i<250;i++)step(intelligent,.1);if(intelligent.autoSetSlowing||intelligent.speed*1.94384<5||intelligent.pots.length)throw Error('Intelligent braking or sonar gate failed');const runout=sea(),core=crabHotspot(groundsAt(runout.hour)[0],5,runout.hour);Object.assign(runout,{x:core.x,y:core.y,speed:6,desiredKnots:12});Object.assign(runout.career,{autoDeploy:false,intelligentAutoSet:true,skills:{autoDeploy:1,intelligentAutoSet:1},parts:{sonar:5}});for(let i=0;i<600&&!runout.pots.length;i++)step(runout,.1);if(!(runout.intelligentSetRunout>299))throw Error('Missing 300 m runout');runout.deck=0;runout.career.parts.sonar=0;let meters=0;for(let i=0;i<3000&&runout.intelligentSetRunout>0;i++){const x=runout.x,y=runout.y;step(runout,.1);meters+=Math.hypot(runout.x-x,runout.y-y);if(runout.speed*1.94384>=5)throw Error('Accelerated during runout');}if(meters<299||meters>301)throw Error('Wrong runout distance');for(let i=0;i<300;i++)step(runout,.1);if(runout.speed*1.94384<8)throw Error('Cruise did not resume');const s=sea();s.career.skills.autoDeploy=1;s.career.autoDeploy=true;s.speed=1;s.pots=[{id:99,x:919,y:500,setAt:s.hour}];step(s,0);if(s.deckJob?.kind!=='deploy')throw Error('No automatic deployment at 81 m');s.career.autoDeploy=false;for(let i=0;i<30;i++)step(s,1);if(s.pots.length!==2)throw Error('Deployment did not complete');const h=sea();h.career.skills.autoHaul=1;h.career.autoHaul=true;h.pots=[{id:1,x:1000,y:510,setAt:h.hour},{id:2,x:1000,y:530,legacyAbundance:1,setAt:h.hour-3}];step(h,0);if(h.deckJob?.potId!==2)throw Error('Wrong haul selection');for(let i=0;i<60;i++)step(h,1);if(h.pots.length!==1||h.pots[0].id!==1||h.cargo<=0)throw Error('Haul did not complete');const pickup=sea();pickup.career.skills.pickupAll=1;pickup.career.skills.autoHaul=1;pickup.pots=[{id:1,x:1400,y:525,setAt:8},{id:2,x:1650,y:600,setAt:4}];if(!pickupAllPots(pickup)||pickup.autopilot.route.filter(p=>p.pickupId).length!==2)throw Error('Collection route missing waypoints');let movingHauls=0;for(let i=0;i<12000&&pickup.skipperMission;i++){step(pickup,.1);if(pickup.deckJob?.kind==='haul'){if(pickup.speed<.15||pickup.speed*1.94384>=5)throw Error('Collection stopped or hauled too fast');movingHauls++;}}if(pickup.pots.length||movingHauls<100)throw Error('Collection incomplete');document.querySelector('#result').textContent=`PASS: intelligent setting holds 4.5 kn for 300 m after release, then resumes cruise.\nPASS: all-pot route retrieves both pots in motion.\nPASS: Intelligent Auto Set maintains cruise under autopilot when the sonar signal is weak.\nPASS: auto set starts at 81 m and completes deployment.\nPASS: auto haul retrieves the soaked pot despite a nearer fresh pot.\nPASS: fresh pot remains in the water.\nCrab landed in hold: ${h.cargo} kg.`;}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;}};
</script></html>
