<!doctype html><html lang="en"><meta charset="utf-8"><title>Pot automation regression</title><style>body{background:#0d1b22;color:#e3eee9;font:20px system-ui;padding:40px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Pot automation regression</h1><button id="run">Run auto set and auto haul</button><pre id="result">Ready</pre><script type="module">
import {createGame,step} from '../simulation.mjs?v=0.17.20';
const sea=()=>{const s=createGame();Object.assign(s,{x:1000,y:500,heading:0,paused:false,weatherOverride:'calm'});s.career.nextIncident=1e6;return s;};
document.querySelector('#run').onclick=()=>{try{const s=sea();s.career.skills.autoDeploy=1;s.career.autoDeploy=true;s.speed=1;s.pots=[{id:99,x:919,y:500,setAt:s.hour}];step(s,0);if(s.deckJob?.kind!=='deploy')throw Error('No automatic deployment at 81 m');s.career.autoDeploy=false;for(let i=0;i<30;i++)step(s,1);if(s.pots.length!==2)throw Error('Deployment did not complete');const h=sea();h.career.skills.autoHaul=1;h.career.autoHaul=true;h.pots=[{id:1,x:1000,y:510,setAt:h.hour},{id:2,x:1000,y:530,setAt:h.hour-3}];step(h,0);if(h.deckJob?.potId!==2)throw Error('Wrong haul selection');for(let i=0;i<60;i++)step(h,1);if(h.pots.length!==1||h.pots[0].id!==1||h.cargo<=0)throw Error('Haul did not complete');document.querySelector('#result').textContent=`PASS: auto set starts at 81 m and completes deployment.\nPASS: auto haul retrieves the soaked pot despite a nearer fresh pot.\nPASS: fresh pot remains in the water.\nCrab landed in hold: ${h.cargo} kg.`;}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;}};
</script></html>
